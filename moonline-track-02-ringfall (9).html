<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>MOONLINE — Track 02: Ringfall</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#04050a;color:#e8eaee;
  font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
.lbl{letter-spacing:.24em;font-size:10px;color:rgba(232,234,238,.5);text-transform:uppercase}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
#hud.quiet{opacity:.45}
#hudTop{position:absolute;top:16px;left:18px;display:flex;gap:26px;align-items:baseline}
#hudPos{font-size:22px;font-weight:600;letter-spacing:.08em}
#hudDist{font-size:12px;letter-spacing:.14em;color:rgba(232,234,238,.75)}
#hudBot{position:absolute;left:18px;bottom:20px}
#hudSpd{font-size:15px;letter-spacing:.14em}
#boostWrap{margin-top:8px;width:150px;height:2px;background:rgba(232,234,238,.14)}
#boostFill{height:2px;width:100%;background:#e8eaee;transition:width .05s linear}
#hintKeys{position:absolute;right:18px;bottom:22px;text-align:right}

#announce{position:fixed;top:16%;width:100%;text-align:center;letter-spacing:.55em;font-size:14px;
  color:rgba(232,234,238,0);transition:color 1.1s;pointer-events:none;text-transform:uppercase}
#announce.show{color:rgba(232,234,238,.85)}
#countdown{position:fixed;top:34%;width:100%;text-align:center;font-size:62px;font-weight:500;
  letter-spacing:.24em;pointer-events:none;color:#e8eaee}
#veil{position:fixed;inset:0;pointer-events:none;opacity:0;background:#a9adbd}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,84,52,0) 42%,rgba(255,64,42,.55) 100%)}

/* ---- grid / vehicle select ---- */
#gridUI{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  align-items:center;padding:26px 14px 22px;pointer-events:none}
#gTop{text-align:center}
#gTitle{letter-spacing:.5em;font-size:13px;margin-bottom:10px}
#gSub{font-size:12px;line-height:1.8;color:rgba(232,234,238,.7);letter-spacing:.06em}
#gCard{width:min(400px,92vw);border:1px solid rgba(232,234,238,.16);background:rgba(4,5,10,.66);
  padding:16px 16px 14px;pointer-events:auto;backdrop-filter:blur(3px)}
#gRow{display:flex;align-items:center;gap:12px}
#gMid{flex:1;min-width:0}
#vName{font-size:20px;font-weight:600;letter-spacing:.16em}
#vLine{font-size:11px;line-height:1.65;color:rgba(232,234,238,.68);margin:6px 0 12px;min-height:38px}
.bar{margin-bottom:8px}
.bar i{display:block;height:2px;background:rgba(232,234,238,.12);margin-top:4px;font-style:normal}
.bar b{display:block;height:2px;background:#e8eaee;transition:width .35s ease}
.nav{pointer-events:auto;background:none;border:1px solid rgba(232,234,238,.28);color:#e8eaee;
  width:38px;height:52px;font-size:20px;cursor:pointer;font-family:inherit}
.nav:active{background:rgba(232,234,238,.12)}
#btnLaunch{display:block;width:100%;margin-top:14px;padding:12px 0;background:none;cursor:pointer;
  border:1px solid rgba(232,234,238,.4);color:#e8eaee;font-family:inherit;font-size:13px;letter-spacing:.34em}
#btnLaunch:active{background:rgba(232,234,238,.14)}
#gHint{text-align:center;margin-top:10px}

/* ---- results ---- */
#results{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(3,4,8,.55);backdrop-filter:blur(2px);text-align:center;padding:20px}
#resTitle{font-size:46px;font-weight:600;letter-spacing:.3em;margin-bottom:8px}
#resSub{font-size:12px;letter-spacing:.14em;color:rgba(232,234,238,.75);margin-bottom:26px}
#relLbl{position:fixed;bottom:26px;left:0;right:0;text-align:center;display:none;
  font-size:10px;letter-spacing:.3em;color:rgba(232,234,238,.55)}
#fieldNote{font-size:10px;letter-spacing:.18em;line-height:1.9;color:rgba(232,234,238,.42);
  max-width:540px;text-align:center;margin-bottom:26px;padding:0 24px}
#resList{font-size:12px;line-height:2.1;letter-spacing:.1em;color:rgba(232,234,238,.85);margin-bottom:30px;text-align:left}
#btnAgain{padding:12px 44px;background:none;border:1px solid rgba(232,234,238,.4);color:#e8eaee;
  font-family:inherit;font-size:13px;letter-spacing:.34em;cursor:pointer}
#btnAgain:active{background:rgba(232,234,238,.14)}
#resFoot{margin-top:34px}

/* ---- touch boost ---- */
#boostBtn{position:fixed;right:18px;bottom:60px;width:88px;height:88px;display:none;align-items:center;
  justify-content:center;border:1px solid rgba(232,234,238,.35);border-radius:50%;font-size:11px;
  letter-spacing:.24em;color:rgba(232,234,238,.85);background:rgba(255,255,255,.04);z-index:5}
#boostBtn.hot{background:rgba(232,234,238,.16)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="hud">
  <div id="hudTop"><span id="hudPos">—</span><span id="hudDist"></span></div>
  <div id="hudBot">
    <div id="hudSpd">0.0 KM/S</div>
    <div id="boostWrap"><div id="boostFill"></div></div>
  </div>
  <div id="hintKeys" class="lbl">arrows / wasd steer · shift boost</div>
</div>

<div id="announce"></div>
<div id="countdown"></div>
<div id="flash"></div>
<div id="veil"></div>

<div id="gridUI">
  <div id="gTop">
    <div id="gTitle" class="lbl">moonline · track 02 — ringfall</div>
    <div id="gSub">You arrive above the plane. You are already on the start line.<br/>Destination: the cloud tops.</div>
  </div>
  <div id="gCard">
    <div id="gRow">
      <button class="nav" id="btnPrev">‹</button>
      <div id="gMid">
        <div id="vName"></div>
        <div id="vLine"></div>
        <div class="bar"><span class="lbl">top speed</span><i><b id="bTop"></b></i></div>

  </div>
</div>

<div id="relLbl"></div>
<div id="results">
  <div id="resTitle"></div>
  <div id="resSub"></div>
  <div id="resList"></div>
  <div id="fieldNote"></div>
  <button id="btnRelive">RELIVE</button>
  <button id="btnAgain">AGAIN</button>

</div>

<div id="boostBtn">BOOST</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*GAME*/
'use strict';
(function(){
// ------------------------------------------------------------ helpers
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
let RNG=Math.random;                              // visuals & world-building draw here
const rand=(a,b)=>a+RNG()*(b-a);
const vrand=(a,b)=>a+Math.random()*(b-a);   // visual draws: never from the sim's stream
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function isoWeekSeed(){                            // the game publishes its own weekly universe
  const d=new Date();
  const t0=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  const day=(t0.getUTCDay()+6)%7;
  t0.setUTCDate(t0.getUTCDate()-day+3);
  const y=t0.getUTCFullYear();
  const jan4=new Date(Date.UTC(y,0,4));
  return y*100+(1+Math.round(((t0-jan4)/86400000-3+((jan4.getUTCDay()+6)%7))/7));
}
let SEED=isoWeekSeed()>>>0,SEED_WEEKLY=true;
try{
  const m=/[?&]seed=([0-9a-fA-F]+)/.exec(window.location.search||'');
  if(m){SEED=parseInt(m[1],16)>>>0;SEED_WEEKLY=false;}
}catch(e){}
const SEED_HEX=SEED.toString(16).toUpperCase();
const SIM_DT=1/120;                                // the race computes the same everywhere
const $=id=>document.getElementById(id);
const TRACK_KEY='ringfall';   // sovereign-local: the standing line lives on this device alone
function loadLine(){try{const v=window.localStorage.getItem('moonline.line.'+TRACK_KEY);return v?parseFloat(v):null;}catch(e){return null;}}
let splits={},splitMark=0,splitIdx=-1;   // the crossing, sector by sector
function loadSplits(){try{const v=window.localStorage.getItem('moonline.splits.'+TRACK_KEY);return v?JSON.parse(v):null;}catch(e){return null;}}
function saveSplits(o){try{window.localStorage.setItem('moonline.splits.'+TRACK_KEY,JSON.stringify(o));}catch(e){}}
function saveLine(v){try{window.localStorage.setItem('moonline.line.'+TRACK_KEY,String(v)+'|'+SEED_HEX);}catch(e){}}

// ------------------------------------------------------------ course
const FINISH=27000;
const PLANE_Y=-0.5;    // centre of the ring sheet
const PLANE_HALF=3.0;  // wide beyond reason, thin beyond belief
const SHEAR_K=1.1;     // keplerian shear: the inner ice runs ahead, the outer falls behind
const SECTIONS=[
  {at:0,     name:'THE F RING',           ast:3.6, spk:0,    hitP:0.06,  light:1.0,  wave:0, dil:1.0,  den:0.7},
  {at:3800,  name:'THE KEELER GAP',       ast:1.7, spk:0,    hitP:0.05,  light:1.0,  wave:1, dil:0.7,  den:0.55},
  {at:9200,  name:'THE CASSINI DIVISION', ast:0.08,spk:0,    hitP:0.006, light:1.15, wave:0, dil:0.5,  den:0.08},
  {at:13600, name:'THE SHADOW',           ast:8.2, spk:0,    hitP:0.16,  light:0.05, wave:0, dil:0.55, den:0.95},
  {at:18400, name:'THE SPOKES',           ast:5.4, spk:0.8, hitP:0.12,  light:1.0,  wave:0, dil:1.1,  den:0.85},
  {at:23200, name:'RINGFALL',             ast:0.8, spk:0,    hitP:0.03,  light:1.05, wave:0, dil:0.5,  den:0.3}
];
function sectionAt(s){let c=SECTIONS[0];for(let i=0;i<SECTIONS.length;i++){if(s>=SECTIONS[i].at)c=SECTIONS[i];}return c;}
function mediumMul(def,sec){
  if(def.key==='trawler')return 0.35+((sec&&sec.den!==undefined)?sec.den:0.5)*1.3;
  if(def.key==='pendulum'){const d=(sec&&sec.dil!==undefined)?sec.dil:1;return clamp(1+(1-d)*0.9,0.78,1.55);}   // heavy time is fast time
  return 1;
}

const LANE_X=[-7.5,-2.5,2.5,7.5];

// ------------------------------------------------------------ materials
function matS(c,e,ei){return new THREE.MeshStandardMaterial({color:c,emissive:(e||0x000000),emissiveIntensity:(ei||0),roughness:0.55,metalness:0.35});}
function matGlow(c,op){return new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:(op===undefined?0.85:op),blending:THREE.AdditiveBlending,depthWrite:false});}

// ------------------------------------------------------------ vehicle builders
function makeFlame(r,len,color){
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,len,14),matGlow(color,0.8));
  m.rotation.x=Math.PI/2; // apex points +z (astern)
  const core=new THREE.Mesh(new THREE.ConeGeometry(r*0.45,len*0.82,10),matGlow(0xfff6e6,0.9));
  core.position.y=len*0.05; m.add(core);   // the burn has a heart
  return m;
}

function buildShip(){ // VECTOR — black glass and white gold. it spits fire. it is a spaceship, after all.
  const g=new THREE.Group();
  const blk=new THREE.MeshStandardMaterial({color:0x0b0d12,roughness:0.16,metalness:0.92});
  const blk2=new THREE.MeshStandardMaterial({color:0x101318,roughness:0.22,metalness:0.85});
  const gold=new THREE.MeshStandardMaterial({color:0xf3e2ba,roughness:0.24,metalness:1.0,emissive:0x3a2d14,emissiveIntensity:0.25});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.45,1.05,6.2,24),blk);
  body.rotation.x=-Math.PI/2; g.add(body);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.45,1.6,24),blk2);
  nose.rotation.x=-Math.PI/2; nose.position.z=-3.9; g.add(nose);
  const noseRing=new THREE.Mesh(new THREE.TorusGeometry(0.47,0.05,10,28),gold);
  noseRing.position.z=-3.12; g.add(noseRing);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(5.8,0.12,1.9),blk2);
  wing.position.set(0,0,1.7); g.add(wing);
  const wingEdge=new THREE.Mesh(new THREE.BoxGeometry(5.9,0.14,0.14),gold);
  wingEdge.position.set(0,0,0.82); g.add(wingEdge);
  const fin=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.7,1.4),blk2);
  fin.position.set(0,1.0,2.4); g.add(fin);
  const finTip=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.14,1.44),gold);
  finTip.position.set(0,1.86,2.4); g.add(finTip);
  const engMain=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.95,1.5,24),blk);
  engMain.rotation.x=-Math.PI/2; engMain.position.z=3.4; g.add(engMain);
  const nozzleRings=[];
  for(let i=0;i<3;i++){
    const nr=new THREE.Mesh(new THREE.TorusGeometry(0.9-i*0.03,0.05,10,28),gold);
    nr.position.z=3.9+i*0.22; g.add(nr); nozzleRings.push(nr);
  }
  const flames=[];
  const fMain=makeFlame(0.72,3.6,0xffa53d); fMain.position.set(0,0,4.8); g.add(fMain); flames.push(fMain);
  for(let side=-1;side<=1;side+=2){
    const pod=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.48,2.5,20),blk);
    pod.rotation.x=-Math.PI/2; pod.position.set(side*2.0,0,2.0); g.add(pod);
    const podRing=new THREE.Mesh(new THREE.TorusGeometry(0.44,0.04,8,24),gold);
    podRing.position.set(side*2.0,0,3.22); g.add(podRing);
    const fl=makeFlame(0.4,2.4,0xffa53d); fl.position.set(side*2.0,0,3.9); g.add(fl); flames.push(fl);
  }
  // the firework show: sparks thrown from the burn
  const sparks=[];
  for(let i=0;i<16;i++){
    const sp=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.34),matGlow(0xffc36b,0));
    sp.visible=false; g.add(sp); sparks.push({m:sp,life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0});
  }
  g.userData.anim=function(dt,st){
    for(let i=0;i<flames.length;i++){
      const f=flames[i];
      f.scale.set(1,0.55+st.n*1.5+(st.boost?1.15:0)+Math.random()*0.3,1);
      f.material.opacity=0.35+st.n*0.5+(st.boost?0.18:0);
      f.material.color.setHex(st.boost?0x9fd4ff:0xffa53d);
    }
    for(let i=0;i<nozzleRings.length;i++)nozzleRings[i].material.emissiveIntensity=0.2+st.n*0.35+(st.boost?0.2:0);
    // sparks: the show scales with the burn
    const want=(st.boost?3:(st.n>0.65?1:0));
    for(let w=0;w<want;w++){
      for(let i=0;i<sparks.length;i++){const s=sparks[i];if(s.life>0)continue;
        s.life=0.5+Math.random()*0.3;
        s.x=(Math.random()-0.5)*0.8;s.y=(Math.random()-0.5)*0.8;s.z=4.6;
        s.vx=(Math.random()-0.5)*3.4;s.vy=(Math.random()-0.5)*3.4;s.vz=9+Math.random()*8;
        s.m.visible=true;break;}
    }
    for(let i=0;i<sparks.length;i++){const s=sparks[i];
      if(s.life<=0)continue;
      s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;
      s.m.position.set(s.x,s.y,s.z);
      s.m.material.opacity=Math.max(0,s.life)*1.6;
      s.m.material.color.setHex(st.boost?0x9fd4ff:(Math.random()<0.2?0xfff2c8:0xffc36b));
      if(s.life<=0)s.m.visible=false;
    }
  };
  return g;
}

function buildPendulum(){ // PENDULUM — the first machines were clocks
  const g=new THREE.Group();
  const bone=new THREE.MeshStandardMaterial({color:0xe8e2d2,roughness:0.5,metalness:0.15});
  const bronze=new THREE.MeshStandardMaterial({color:0x6b4c26,roughness:0.34,metalness:0.9,emissive:0x1c1206,emissiveIntensity:0.3});
  // the balance beam, and its two masses — time, carried at both ends
  const beamGrp=new THREE.Group(); beamGrp.position.y=0.35; g.add(beamGrp);
  const beam=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.34,5.8),bronze); beamGrp.add(beam);
  const bobF=new THREE.Mesh(new THREE.SphereGeometry(0.46,20,20),bone); bobF.position.z=-2.9; beamGrp.add(bobF);
  const bobA=new THREE.Mesh(new THREE.SphereGeometry(0.46,20,20),bone); bobA.position.z=2.9; beamGrp.add(bobA);
  const collarF=new THREE.Mesh(new THREE.TorusGeometry(0.48,0.045,8,24),bronze); collarF.position.z=-2.36; beamGrp.add(collarF);
  const collarA=new THREE.Mesh(new THREE.TorusGeometry(0.48,0.045,8,24),bronze); collarA.position.z=2.36; beamGrp.add(collarA);
  // the works: a drum, and the escapement that turns in ticks
  const drum=new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,0.6,24),bone);
  drum.rotation.x=Math.PI/2; g.add(drum);
  const esc=new THREE.Mesh(new THREE.TorusGeometry(1.32,0.09,10,48),bronze); g.add(esc);
  const teeth=new THREE.Group(); esc.add ? g.add(teeth) : null;
  for(let i=0;i<12;i++){
    const th=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.22,0.1),bronze);
    const a=i/12*Math.PI*2;
    th.position.set(Math.cos(a)*1.32,Math.sin(a)*1.32,0);
    th.rotation.z=a; teeth.add(th);
  }
  const tickRing=new THREE.Mesh(new THREE.TorusGeometry(1.02,0.045,8,40),matGlow(0x59d8c8,0.3)); g.add(tickRing);
  const heart=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,12),matGlow(0x9ff0e4,0.4)); g.add(heart);
  // regulator fins
  for(let sd=-1;sd<=1;sd+=2){
    const fin=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.07,0.9),bone);
    fin.position.set(sd*1.0,-0.15,1.3); fin.rotation.z=sd*0.12; g.add(fin);
  }
  let tickT=0,tickGlow=0,swing=Math.random()*6;
  g.userData.anim=function(dt,st){
    // the escapement advances in ticks. under boost, the clock races.
    const P=(st.boost?0.25:0.5);
    tickT+=dt;
    if(tickT>=P){tickT-=P;esc.rotation.z+=Math.PI/6;teeth.rotation.z+=Math.PI/6;tickGlow=1;}
    tickGlow=Math.max(0,tickGlow-dt*4);
    tickRing.material.opacity=0.18+tickGlow*0.5+st.n*0.15;
    heart.material.opacity=0.22+tickGlow*0.55;
    swing+=dt*(2.1+st.n*1.4);
    beamGrp.rotation.z=Math.sin(swing)*0.16*(0.35+st.n*0.65);   // the balance keeps its swing
    drum.rotation.y+=dt*0.5;
  };
  return g;
}

function buildCaravel(){ // CARAVEL — no engine. carried by light.
  const g=new THREE.Group();
  const hull=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.34,5.2),matS(0xe4e7ea,0xcfe0ff,0.08));
  hull.position.y=0.2; g.add(hull);
  const prow=new THREE.Mesh(new THREE.ConeGeometry(0.24,1.1,8),matS(0xd9dee6));
  prow.rotation.x=-Math.PI/2; prow.position.set(0,0.2,-3.1); g.add(prow);
  const mast=new THREE.Mesh(new THREE.BoxGeometry(0.08,3.4,0.08),matS(0xb9c0c9)); mast.position.set(0,1.9,0.6); g.add(mast);
  const spar=new THREE.Mesh(new THREE.BoxGeometry(7.6,0.07,0.07),matS(0xb9c0c9)); spar.position.set(0,3.3,0.6); g.add(spar);
  const sailG=new THREE.Group(); sailG.position.set(0,1.9,0.65); g.add(sailG);
  const sail=new THREE.Mesh(new THREE.PlaneGeometry(7.2,2.9),matGlow(0xcfe0ff,0.28));
  sailG.add(sail);
  const sail2=new THREE.Mesh(new THREE.PlaneGeometry(7.2,2.9),matGlow(0x9fd4ff,0.1));
  sail2.position.z=0.03; sail2.rotation.y=0.05; sailG.add(sail2);
  const keel=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.1),matGlow(0xcfe0ff,0.18));
  keel.position.set(0,-0.55,0.6); g.add(keel);
  let shim=Math.random()*9;
  g.userData.anim=function(dt,st){
    shim+=dt;
    sailG.rotation.z=Math.sin(shim*0.6)*0.05;
    sailG.rotation.x=-0.12-st.n*0.1;                       // sail leans into the light
    const flare=(st.boost?0.5:0);                          // catching a flare

  // the field: a glow funnel that drinks inward

  field.rotation.x=-Math.PI/2; field.position.set(0,0.1,-0.9); g.add(field);

  throat.rotation.x=Math.PI/2; throat.position.set(0,0.1,0.2); g.add(throat);
  // aft: a small honest engine — it burns what it catches
  const eng=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.44,0.8,10),matS(0x2a313a));
  eng.rotation.x=Math.PI/2; eng.position.set(0,0.1,2.9); g.add(eng);

    vane.position.set(sd*1.1,0.1,1.6); vane.rotation.z=sd*0.15; g.add(vane);
  }
  let ph=Math.random()*9;
  g.userData.anim=function(dt,st){

    const den=(st.den===undefined?0.5:st.den);
    field.material.opacity=0.10+den*0.5+st.n*0.15+Math.sin(ph*6)*0.04*den;  // thick sky is bright sky
    throat.material.opacity=0.18+den*0.5;
    fl.material.opacity=0.25+st.n*0.4+(st.boost?0.3:0);
    fl.scale.set(1,0.6+st.n*0.9+(st.boost?0.5:0)+Math.random()*0.15,1);
    mouth.rotation.z+=dt*(0.4+den*1.6);   // the intake spins harder where the feeding is good
    counterRing.rotation.z-=dt*(0.6+den*2.2);            // and its field turns against it
    counterRing.material.opacity=0.1+den*0.35;
    mouth.material.emissiveIntensity=0.3+den*0.55;       // ionized hydrogen burns blue where it feeds
  };
  return g;
}

// Procedural textures & sprites, drawn at load from the VISUAL stream only.
// Everything here is guarded: in a headless harness it degrades to flat color
// and the simulation is untouched either way.
function makeCanvas(w,h,draw){
  try{const c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');if(!g)return null;draw(g,w,h);return c;
  }catch(e){return null;}
}
function ctex(c){try{if(!c||!THREE.CanvasTexture)return null;const t=new THREE.CanvasTexture(c);return t;}catch(e){return null;}}
function softDot(size,inner,outer){
  return ctex(makeCanvas(size,size,function(g,w,h){
    const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    r.addColorStop(0,inner);r.addColorStop(0.4,inner);r.addColorStop(1,outer);
    g.fillStyle=r;g.fillRect(0,0,w,h);
  }));
}
const SPRITE_STAR=softDot(64,'rgba(255,255,255,1)','rgba(255,255,255,0)');
function applySprite(mat,scale){if(SPRITE_STAR){mat.map=SPRITE_STAR;mat.alphaTest=0.02;if(scale)mat.size*=scale;mat.needsUpdate=true;}}
function nebulaDome(radius,blobs){
  const c=makeCanvas(1024,512,function(g,w,h){
    g.fillStyle='rgba(0,0,0,0)';g.clearRect(0,0,w,h);
    for(let i=0;i<blobs.length;i++){
      const b=blobs[i];
      const x=Math.random()*w,y=Math.random()*h,r=(0.22+Math.random()*0.26)*w;
      const gr=g.createRadialGradient(x,y,0,x,y,r);
      gr.addColorStop(0,b);gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
    }
  });
  const t=ctex(c); if(!t)return null;
  try{
    const m=new THREE.Mesh(new THREE.SphereGeometry(radius,24,16),
      new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:0.75,fog:false,
        side:(THREE.BackSide!==undefined?THREE.BackSide:2),depthWrite:false}));
    scene.add(m);return m;
  }catch(e){return null;}
}

function makeStars(n,rMin,rMax,size,op){
  const pos=new Float32Array(n*3);

  const mat=new THREE.PointsMaterial({color:0xffffff,size:size,sizeAttenuation:false,transparent:true,opacity:op,depthWrite:false,fog:false});
  applySprite(mat,1.6);
  return new THREE.Points(geo,mat);
}

// ------------------------------------------------------------ audio (Web Audio, gesture-gated)
let actx=null,engOsc=null,engGain=null,engFilt=null,windGain=null,driftGain=null;
function initAudio(){
  if(actx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    actx=new AC();
    engOsc=actx.createOscillator(); engOsc.type='sawtooth'; engOsc.frequency.value=42;
    engFilt=actx.createBiquadFilter(); engFilt.type='lowpass'; engFilt.frequency.value=260;
    engGain=actx.createGain(); engGain.gain.value=0.0;
    engOsc.connect(engFilt); engFilt.connect(engGain); engGain.connect(actx.destination);
    engOsc.start();
    const len=actx.sampleRate*1.5;
    const buf=actx.createBuffer(1,len,actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=520; bp.Q.value=0.7;
    windGain=actx.createGain(); windGain.gain.value=0.0;
    src.connect(bp); bp.connect(windGain); windGain.connect(actx.destination);
    src.start();
    // the drift's breath: a low fifth, barely there, only when the race lets go
    driftGain=actx.createGain(); driftGain.gain.value=0.0; driftGain.connect(actx.destination);
    const dr1=actx.createOscillator(); dr1.type='sine'; dr1.frequency.value=55;
    const dr2=actx.createOscillator(); dr2.type='sine'; dr2.frequency.value=82.6;
    const drLfo=actx.createOscillator(); drLfo.type='sine'; drLfo.frequency.value=0.07;
    const drLfoG=actx.createGain(); drLfoG.gain.value=0.9;
    drLfo.connect(drLfoG); drLfoG.connect(dr2.frequency);
    dr1.connect(driftGain); dr2.connect(driftGain);
    dr1.start(); dr2.start(); drLfo.start();
  }catch(e){actx=null;}
}
function setEngine(n,boost,quiet){
  if(!actx)return;
  const q=quiet?0.55:1;
  engOsc.frequency.value=40+n*130;
  engFilt.frequency.value=240+n*1500;
  engGain.gain.value=(0.04+n*0.055+(boost?0.03:0))*q;
  windGain.gain.value=n*0.13*q;
}
function blip(f,d,g){
  if(!actx)return;
  const o=actx.createOscillator(),gn=actx.createGain();
  o.type='sine'; o.frequency.value=f;
  gn.gain.setValueAtTime(g||0.18,actx.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+(d||0.12));
  o.connect(gn); gn.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+(d||0.12)+0.02);
}
function thud(){
  if(!actx)return;
  const o=actx.createOscillator(),gn=actx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(170,actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(50,actx.currentTime+0.18);
  gn.gain.setValueAtTime(0.22,actx.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.2);
  o.connect(gn); gn.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+0.22);
}
function finishTone(){blip(520,0.22,0.16);setTimeout(function(){blip(780,0.34,0.16);},170);}

let joyId=null,joySX=0,joySY=0,joyX=0,joyY=0,touchBoost=false;
window.addEventListener('keydown',function(e){
  initAudio();
  keys[e.code]=true;
  if(phase==='grid'){
    if(e.code==='ArrowLeft'||e.code==='KeyA')cycle(-1);
    if(e.code==='ArrowRight'||e.code==='KeyD')cycle(1);
    if(e.code==='Enter'||e.code==='Space'){e.preventDefault();confirmPick();}
  }
  if(e.code==='Space')e.preventDefault();
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
renderer.domElement.addEventListener('pointerdown',function(e){
  initAudio();
  if((phase==='race'||phase==='done')&&joyId===null){
    joyId=e.pointerId;joySX=e.clientX;joySY=e.clientY;
  }
});
window.addEventListener('pointermove',function(e){
  if(e.pointerId===joyId){
    joyX=clamp((e.clientX-joySX)/64,-1,1);
    joyY=clamp((joySY-e.clientY)/64,-1,1);
  }
});
function joyEnd(e){if(e.pointerId===joyId){joyId=null;joyX=0;joyY=0;}}
window.addEventListener('pointerup',joyEnd);
window.addEventListener('pointercancel',joyEnd);
boostBtn.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();touchBoost=true;boostBtn.classList.add('hot');});
boostBtn.addEventListener('pointerup',function(){touchBoost=false;boostBtn.classList.remove('hot');});
boostBtn.addEventListener('pointercancel',function(){touchBoost=false;boostBtn.classList.remove('hot');});
function inputDir(){
  let x=0,y=0;
  if(keys['ArrowLeft']||keys['KeyA'])x-=1;
  if(keys['ArrowRight']||keys['KeyD'])x+=1;
  if(keys['ArrowUp']||keys['KeyW'])y+=1;
  if(keys['ArrowDown']||keys['KeyS'])y-=1;
  return {x:clamp(x+joyX,-1,1),y:clamp(y+joyY,-1,1)};
}
function boostHeld(){return !!(keys['ShiftLeft']||keys['ShiftRight']||keys['Space']||touchBoost);}

// ------------------------------------------------------------ grid ui
let sel=0;
function showVehicle(){
  const d=VEHICLES[sel];
  vName.textContent=d.name;
  vLine.textContent=d.line;
  bTop.style.width=Math.round(d.top/360*100)+'%';
  bAcc.style.width=Math.round(d.accel/70*100)+'%';
  bHan.style.width=Math.round(d.steer/32*100)+'%';
}
function cycle(dir){sel=(sel+dir+VEHICLES.length)%VEHICLES.length;showVehicle();blip(560,0.05,0.08);}
$('btnPrev').addEventListener('click',function(){initAudio();cycle(-1);});
$('btnNext').addEventListener('click',function(){initAudio();cycle(1);});
$('btnLaunch').addEventListener('click',function(){initAudio();confirmPick();});
$('btnAgain').addEventListener('click',function(){window.location.reload();});
$('btnRelive').addEventListener('click',function(){startRelive();});
$('fieldNote').textContent='field note — the rings are likely younger than the sharks, and they are raining away. in a few hundred million years, this track will not exist.';
showVehicle();

// ------------------------------------------------------------ state
let phase='grid';
let t=0,raceT=0,cdT=0,cdStep=-1,doneT=0,resShown=false;
let driftT=0,driftK=0,driftOn=false,raceWentOn=false;   // THE DRIFT: the game within the game
let hYaw=0,hPit=0,hYawV=0,hPitV=0,camYaw=0,camPit=0;    // heading: only the drift is given one
let shake=0,curSecName='',annT=0,openShown=false,anchorK=0;
const clock=new THREE.Clock();

function confirmPick(){
  if(phase!=='grid')return;
  player=racers[sel];player.isPlayer=true;
  gridUI.style.display='none';
  selRing.visible=false;
  hudEl.classList.add('on');
  if(coarse)boostBtn.style.display='flex';
  // the field is not here to lose: one contender, one strong, one honest journeyman
  RNG=mulberry32(SEED);                            // from here, the universe is the seed's
  recBuf.length=0;inpBuf.length=0;
  for(let i=0;i<racers.length;i++){const r=racers[i];
    r.weavePhase=rand(0,6.28);r.nextBoost=rand(8,16);
    if(r.nerve!==undefined)r.nerve=rand(0,1);
  }
  racers.forEach(function(r){r.vx=0;r.vy=0;r.xOff=0;});
  splits={};splitMark=0;splitIdx=-1;openShown=false;anchorK=0;
  driftT=0;driftK=0;driftOn=false;raceWentOn=false;hYaw=0;hPit=0;hYawV=0;hPitV=0;camYaw=0;camPit=0;
  // the contender is whoever brought the fastest machine. a field that cannot win is not a field.
  const pool=[0.995,0.965,0.93];
  const rivals=racers.filter(function(r){return r!==player;})
    .sort(function(a,b){return b.def.top-a.def.top;});   // the fastest machine carries the best pilot
  for(let i=0;i<rivals.length;i++)rivals[i].skillBase=pool[Math.min(i,pool.length-1)]+rand(-0.008,0.008);
  phase='count';cdT=0;cdStep=-1;
}

// ------------------------------------------------------------ updates
function placeWorld(viewS){
  for(let i=0;i<worldObjs.length;i++){
    worldObjs[i].mesh.position.z=-(worldObjs[i].s-viewS);
  }
  const prog=clamp(viewS/FINISH,0,1);
  saturn.position.set(lerp(-1450,-900,prog),lerp(-620,-950,prog),-3300);
  const ss=lerp(1,1.9,prog);
  saturn.scale.set(ss,ss,ss);
  farRing.position.set(saturn.position.x,saturn.position.y,saturn.position.z);
  farRing.scale.set(ss,ss,ss);
  saturn.rotation.y+=0.00005;
  galaxy.rotation.z+=0.00004;
}
function placeRacers(viewS,dt){
  for(let i=0;i<racers.length;i++){
    const r=racers[i];
    r.mesh.position.set(r.x,r.y,-(r.s-viewS));
    const n=clamp(r.speed/r.def.top,0,1);
    const dsec=sectionAt(r.s);
    if(r.mesh.userData.anim)r.mesh.userData.anim(dt,{n:n,speed:r.speed,boost:(r===player?(playerBoosting):(r.boostT>0)),den:(dsec.den!==undefined?dsec.den:0.5)});
  }
}
let playerBoosting=false;
let boostMeter=100;

function updateGrid(dt){
  for(let i=0;i<racers.length;i++){
    racers[i].y=Math.sin(t*1.7+i*1.3)*0.12;
    racers[i].x=LANE_X[i];
  }
  selRing.position.x+=(LANE_X[sel]-selRing.position.x)*Math.min(1,dt*8);
  const aspect=window.innerWidth/Math.max(1,window.innerHeight);
  const gz=Math.max(24,12.5/(Math.tan(0.576)*aspect)); // keep ±10 lanes framed on portrait
  camera.position.set(Math.sin(t*0.18)*2.2,5.2,gz);
  camera.lookAt(0,0.6,-14);
  camera.fov=66;camera.updateProjectionMatrix();
  placeWorld(0);placeRacers(0,dt);
  setEngine(0.06,false,false);
}

function updateCount(dt){
  cdT+=dt;
  const step=Math.floor(cdT/0.85);
  if(step!==cdStep){
    cdStep=step;
    if(step<3){cdEl.textContent=String(3-step);blip(430+step*60,0.1,0.14);}
    else{cdEl.textContent='GO';blip(880,0.2,0.18);phase='race';raceT=0;}
  }
  camera.position.set(player.x*0.55,4.6,16);
  camera.lookAt(player.x*0.8,1,-60);
  placeWorld(0);placeRacers(0,dt);
}

function updateRival(r,dt){
  const sec=sectionAt(r.s);
  const see=(r.skillBase||0.92);
  const elite=see>0.98;                    // the contender sees earlier and commits sooner
  if(RNG()<sec.hitP*(elite?0.22:0.5)*dt){r.speed*=0.55;r.hitFlash=0.3;}
  // they fly the same field you do: they look ahead, they move, and they can fail to
  if(r.evade===undefined)r.evade=0;
  let threat=null,tNear=1e9;
  for(let i=0;i<asteroids.length;i++){
    const a=asteroids[i],ds=a.s-r.s;
    if(ds<-8||ds>430)continue;
    if(Math.abs(a.x-r.x)>8.5||Math.abs(a.y-r.y)>7)continue;
    if(ds<tNear){tNear=ds;threat=a;}
  }
  if(threat){
    r.evade+=(((threat.x>=r.x?-1:1)*see*1.25)-r.evade)*Math.min(1,dt*(elite?4.4:3.2));
    if(tNear<26){
      const cdx=threat.x-r.x,cdy=threat.y-r.y,cr=(threat.r||1.4)+1.7;
      if(cdx*cdx+cdy*cdy<cr*cr){r.speed*=(elite?0.78:0.6);r.hitFlash=0.3;r.evade*=-0.4;}
    }
  }else r.evade+=(0-r.evade)*Math.min(1,dt*1.4);
  r.nextBoost-=dt;
  if(r.nextBoost<=0){r.boostT=2.0;r.nextBoost=rand(10,20);}
  if(r.boostT>0)r.boostT-=dt;
  const skill=(r.skillBase||0.92)+0.015*Math.sin(t*0.23+r.weavePhase*3);
  const cap=r.def.top*skill*(r.boostT>0?1.22:1);
  const rAcc=r.def.accel*mediumMul(r.def,sec);
  if(r.speed<cap)r.speed=Math.min(cap,r.speed+rAcc*0.8*dt);
  else r.speed+=(cap-r.speed)*Math.min(1,dt*2);
  r.s+=(r.speed+(sec.flow||0))*dt;
    // the evade is a slide with mass: thrust toward the gap, then kill the slide
  if(r.vx===undefined)r.vx=0;
  if(r.xOff===undefined)r.xOff=0;
  const rAuth=r.def.steer*2.35*skill, rVMAX=r.def.steer*1.42;
  const rWant=r.evade*5.2;
  r.vx+=clamp((rWant-r.xOff)*1.6-r.vx*1.3,-rAuth,rAuth)*dt;
  r.vx-=r.vx*Math.min(1,dt*0.34);
  r.vx=clamp(r.vx,-rVMAX,rVMAX);
  r.xOff+=r.vx*dt;
  r.speed*=(1-Math.abs(r.vx)/Math.max(1,rVMAX)*0.055*dt);
  r.x=LANE_X[r.lane]*0.9+Math.sin(t*0.7+r.weavePhase)*4.2+r.xOff;
  r.y=PLANE_Y+0.8+Math.sin(t*0.45+r.weavePhase*2)*1.8;
  if(r.hitFlash>0)r.hitFlash-=dt;
  if(!r.finished&&r.s>=FINISH){r.finished=true;r.fTime=raceT;finishOrder.push(r);}
}

function updateHazards(dt,viewS){
  for(let i=asteroids.length-1;i>=0;i--){
    const a=asteroids[i];
    a.x+=a.vx*dt;
    a.s+=SHEAR_K*(-a.x)*dt;                                  // the ice is running its own race
    if(a.wave)a.y=PLANE_Y+2.4*Math.sin(a.s*0.018-t*1.4);     // daphnis's wake
    a.mesh.rotation.x+=a.rx*dt;a.mesh.rotation.y+=a.ry*dt;
    a.mesh.position.set(a.x,a.y,-(a.s-viewS));
    if(a.s<viewS-50){a.mesh.visible=false;astFree.push(a);asteroids.splice(i,1);continue;}
    collide(a);
  }
  for(let i=spokes.length-1;i>=0;i--){
    const sp=spokes[i];
    sp.life+=dt;
    sp.s+=SHEAR_K*(-sp.x)*dt*0.6;
    const k=Math.min(sp.life/1.6,1)*clamp((sp.dur-sp.life)/1.6,0,1);
    sp.mesh.material.opacity=0.3*k*lightLevel;
    sp.mesh.position.set(sp.x,sp.y,-(sp.s-viewS));
    if(sp.life>sp.dur||sp.s<viewS-40){sp.mesh.visible=false;spkFree.push(sp);spokes.splice(i,1);continue;}
    if(player&&!player.finished){
      const lo=(player.prevS!==undefined?player.prevS:player.s)-4;
      if(sp.s>=lo&&sp.s<=player.s+4&&Math.abs(sp.x-player.x)<13&&Math.abs(sp.y-player.y)<5.5){
        fogPulse=Math.min(1,fogPulse+0.75);   // dust does not break a hull. it blinds it.
        blip(150,0.18,0.09);
      }
    }
  }
}
function updateGlints(dt,viewS){
  // sunlight catching the ice — brief, real, gone
  if(lightLevel>0.5&&asteroids.length&&Math.random()<dt*1.3){
    for(let i=0;i<glints.length;i++){const g=glints[i];if(g.life>0)continue;
      const a=asteroids[(Math.random()*asteroids.length)|0];
      g.life=0.28;g.x=a.x;g.y=a.y;g.s=a.s;g.mesh.visible=true;break;}
  }
  for(let i=0;i<glints.length;i++){const g=glints[i];
    if(g.life<=0)continue;
    g.life-=dt;
    g.mesh.position.set(g.x,g.y,-(g.s-viewS));
    g.mesh.material.opacity=Math.max(0,g.life*3)*0.8*lightLevel;
    if(g.life<=0)g.mesh.visible=false;
  }
}
function collide(o){
  if(!player||player.inv>0||player.finished)return;
  // swept along s: hit if the object sits anywhere in the span crossed this frame
  const lo=(player.prevS!==undefined?player.prevS:player.s)-4;
  if(o.s<lo||o.s>player.s+4)return;
  const dx=o.x-player.x,dy=o.y-player.y,rr=o.r+player.def.radius;
  const d2=dx*dx+dy*dy;
  if(d2<rr*rr)hitPlayer(o);
  else if(!o.grazed&&d2<rr*rr*4.8){o.grazed=true;blip(760,0.04,0.04);}
}
function hitPlayer(o){
  if(player.vx===undefined){player.vx=0;player.vy=0;}
  if(o){                                            // struck: the rock shoves, and you keep the shove
    const away=(player.x-o.x>=0?1:-1);
    player.vx+=away*(3+4.5*clamp(((o.r||1.4)-0.7)/2.7,0,1));
    player.vy+=(player.y-o.y>=0?1:-1)*0.8;
  }
  const sz=(o&&o.r?clamp((o.r-0.7)/2.7,0,1):0.4);
  const chain=(raceT-(player.lastHit===undefined?-99:player.lastHit)<4.5);
  player.speed*=lerp(0.62,0.40,sz)*(chain?0.85:1);
  player.inv=1.0;player.hitFlash=0.3;shake=1;thud();
  player.lastHit=raceT;player.rattle=0.32;
}

function fmtTime(s){
  const m=Math.floor(s/60),r=(s-m*60);
  return m+':'+(r<10?'0':'')+r.toFixed(1);
}
(function(){try{const sl=loadLine();if(sl!==null){
  const g=$('gSub');if(g)g.innerHTML+='<br/><span style="opacity:.5">your standing line — '+fmtTime(sl)+'</span>';
}}catch(e){}})();
(function(){try{const g=$('gSub');
  if(g)g.innerHTML+='<br/><span style="opacity:.45">universe '+SEED_HEX+(SEED_WEEKLY?' \u00b7 this week\u2019s':'')+'</span>';
}catch(e){}})();
function renderResultsList(){
  const done=finishOrder.slice();
  const rest=racers.filter(function(r){return !r.finished;}).sort(function(a,b){return b.s-a.s;});
  const all=done.concat(rest);
  let html='';
  for(let i=0;i<all.length;i++){
    const r=all[i];
    html+=(i+1)+'. '+r.def.name+(r===player?' · you':'')+' — '+(r.finished?fmtTime(r.fTime):'on course')+'<br/>';
  }
  resList.innerHTML=html;
}

function updateRace(dt){
  raceT+=dt;
  if(cdEl.textContent&&raceT>0.9)cdEl.textContent='';
  const p=player;
  const dir=inputDir();
  inpBuf.push(dir.x,dir.y,boostHeld()?1:0);        // the raw hands, tick by tick — a line is replayable
  if(p.rattle===undefined)p.rattle=0;
  if(p.rattle>0){p.rattle-=dt;dir.x*=0.15;dir.y*=0.15;}     // rocked: your hands aren't yours for a beat
  p.speed*=(1-Math.abs(p.vx||0)/Math.max(1,p.def.steer*1.42)*0.055*dt);   // carrying sideways speed costs forward speed                     // hard steering scrubs speed. choose a line.
  // boost
  const want=boostHeld();
  if(want&&boostMeter>0){playerBoosting=true;boostMeter=Math.max(0,boostMeter-33*dt);}
  else{playerBoosting=false;
    const cleanFor=raceT-(p.lastHit===undefined?-99:p.lastHit);
    boostMeter=Math.min(100,boostMeter+(cleanFor>4?8:3.5)*dt);   // clean flying feeds the tank
  }
  // speed — out of the sheet you are naked and slow
  const inPlane=Math.abs(p.y-PLANE_Y)<=PLANE_HALF;
  // above the ring there is no ring: nothing to shear against, nothing to ride
  const offPlane=clamp((Math.abs(p.y-PLANE_Y)-PLANE_HALF)/6,0,1);
  const cap=p.def.top*(playerBoosting?1.3:1)*(1-offPlane*0.42);
  const pAcc=p.def.accel*mediumMul(p.def,sectionAt(p.s));
  if(p.speed<cap)p.speed=Math.min(cap,p.speed+pAcc*(playerBoosting?2:1)*dt);
  else p.speed+=(cap-p.speed)*Math.min(1,dt*3);
  // THE OPEN: space continues. the race is a line through it.
  // drift from the line and you still travel — the race just recedes.
  const rOff=Math.sqrt(p.x*p.x+(p.y-1.5)*(p.y-1.5));
  const lineK=clamp(1-Math.max(0,rOff-18)/55,0.3,1);
  dust.material.opacity=0.6*clamp(1-Math.max(0,rOff-18)/40,0.12,1);   // out there, the near medium thins to stars
  p.prevS=p.s;
  // THE RELEASE — in the drift the track stops holding your nose.
  if(driftK>0.02){
    hYawV+=(-dir.x*0.55-hYawV)*Math.min(1,dt*(0.9+driftK*0.5));
    hPitV+=(-dir.y*0.32-hPitV)*Math.min(1,dt*0.8);
    hYaw+=hYawV*dt*driftK;
    hPit=clamp(hPit+hPitV*dt*driftK,-1.15,1.15);
  }else{
    hYaw+=(0-hYaw)*Math.min(1,dt*1.6);
    hPit+=(0-hPit)*Math.min(1,dt*1.6);
    hYawV*=0.9;hPitV*=0.9;
  }
  if(hYaw>Math.PI)hYaw-=Math.PI*2; else if(hYaw<-Math.PI)hYaw+=Math.PI*2;   // a direction, not a tally
  const cy=Math.cos(hYaw),sy2=Math.sin(hYaw),cp=Math.cos(hPit),sp2=Math.sin(hPit);
  p.s+=p.speed*dt*lineK*(driftK>0.02?(cy*cp):1);
  const freeX=p.speed*dt*sy2*cp*driftK*0.55;
  const freeY=p.speed*dt*sp2*driftK*0.45;
  // steer — thrust, not teleportation. you accelerate sideways; you must also stop.
  if(p.vx===undefined){p.vx=0;p.vy=0;}
  const auth=p.def.steer*(p.steerMul||1)*2.9;
  const VMAX=p.def.steer*1.42;
  p.vx+=dir.x*auth*dt*(1-driftK);
  p.vy+=dir.y*auth*0.8*dt*(1-driftK);
  const drag=Math.min(1,dt*0.72);
  p.vx-=p.vx*drag; p.vy-=p.vy*drag;
  p.vx=clamp(p.vx,-VMAX,VMAX); p.vy=clamp(p.vy,-VMAX*0.8,VMAX*0.8);
  p.x=p.x+p.vx*dt*(1-driftK)+freeX;
  p.y=p.y+p.vy*dt*(1-driftK)+freeY;
  if(driftK<0.02){p.x=clamp(p.x,-140,140);p.y=clamp(p.y,-50,110);}
  p.mesh.rotation.y=hYaw;
  p.mesh.rotation.z=-(p.vx/Math.max(1,p.def.steer*1.42))*0.42*(1-driftK)-hYawV*0.5*driftK;
  p.mesh.rotation.x=-(p.vy/Math.max(1,p.def.steer*1.14))*0.2*(1-driftK)+hPit*driftK;
  if(p.inv>0)p.inv-=dt;
  if(p.hitFlash>0)p.hitFlash-=dt;
  flashEl.style.opacity=p.hitFlash>0?(p.hitFlash*2):0;
  p.mesh.visible=!(p.inv>0&&Math.floor(t*14)%2===0);
  // rivals
  for(let i=0;i<racers.length;i++)if(racers[i]!==p)updateRival(racers[i],dt);
  // spawn
  const secAhead=sectionAt(p.s+420);
  astAcc+=secAhead.ast*dt;
  while(astAcc>=1){astAcc-=1;spawnAst(p.s,p.y,secAhead);}
  if((secAhead.name==='THE SHADOW'||secAhead.name==='THE SPOKES')&&RNG()<dt*0.34)spawnSheet(p.s,p.y,secAhead);
  spkAcc+=(secAhead.spk||0)*dt;
  while(spkAcc>=1){spkAcc-=1;spawnSpoke(p.s);}
  updateHazards(dt,p.s);
  updateGlints(dt,p.s);
  // light: the shadow is not an obstacle, it is a place the course passes through
  const secNow=sectionAt(p.s);
  lightLevel+=(secNow.light-lightLevel)*Math.min(1,dt*1.5);
  ambientL.intensity=0.95*Math.max(0.05,lightLevel);
  sun.intensity=1.15*Math.max(0.04,lightLevel);
  // spokes blind; then it clears
  fogPulse=Math.max(0,fogPulse*(1-dt*1.05));
  scene.fog.density=0.0018+fogPulse*0.03;
  veilEl.style.opacity=fogPulse*0.5;
  // the rings thin to nothing; the clouds rise to meet you
  const fallK=clamp((p.s-23200)/(FINISH-23200),0,1);
  const sheetFade=1-fallK*0.94;
  sheetMat.opacity=0.055*Math.max(0.25,lightLevel)*sheetFade;
  sheetBotMat.opacity=0.05*Math.max(0.25,lightLevel)*sheetFade;
  iceMat.opacity=0.5*Math.max(0.2,lightLevel)*sheetFade;
  clouds.position.y=lerp(-520,-34,fallK);
  // dust
  const da=dustAttr.array;
  for(let i=0;i<DUST_N;i++){
    da[i*3+2]+=p.speed*dt*0.92;
    if(da[i*3+2]>14){da[i*3]=vrand(-90,90);da[i*3+1]=vrand(-30,50);da[i*3+2]=-620;}
  }
  dustAttr.needsUpdate=true;
  const ia=iceAttr.array;
  for(let i=0;i<ICE_N;i++){
    ia[i*3+2]+=p.speed*dt*0.96+SHEAR_K*ia[i*3]*dt*0.08;   // the medium is running its own race
    if(ia[i*3+2]>20){ia[i*3]=vrand(-240,240);ia[i*3+1]=PLANE_Y+vrand(-2.8,2.8);ia[i*3+2]=-1500;}
  }
  iceAttr.needsUpdate=true;
  // world
  placeWorld(p.s);placeRacers(p.s,dt);
  // camera
  shake=Math.max(0,shake-dt*2.2);
  const sx=(Math.random()-0.5)*shake*0.9,sy=(Math.random()-0.5)*shake*0.9;
  camYaw+=(hYaw*driftK-camYaw)*Math.min(1,dt*1.5);    // the eye swings after the nose, a beat late
  camPit+=(hPit*driftK-camPit)*Math.min(1,dt*1.5);
  const camR=16;
  const fX=Math.sin(camYaw)*Math.cos(camPit), fY=Math.sin(camPit), fZ=-Math.cos(camYaw)*Math.cos(camPit);
  anchorK+=(clamp(Math.max(driftK,(rOff-24)/44),0,1)-anchorK)*Math.min(1,dt*2.2);
  const aX=p.x*(0.55+0.45*anchorK)+sx, aY=4.6+p.y*(0.5+0.5*anchorK)+sy;
  camera.position.set(aX-fX*camR, aY-fY*camR, -fZ*camR);
  camera.lookAt(aX+fX*60, aY+fY*60-3.6, fZ*60-10);
  camera.fov=63+(p.speed/330)*13*(1-driftK*0.7)+(playerBoosting?4:0)-driftK*5;
  camera.updateProjectionMatrix();
  // sound
  const sec=sectionAt(p.s);
  // THE DRIFT — deep in the open, not reaching for anything, the race lets go of you
  const deepOpen=rOff>105;                       // the open is a wide place. the drift is past the far side of it.
  if(deepOpen&&!boostHeld())driftT+=dt; else driftT=0;
  if(driftT>5)driftOn=true;
  if(driftOn&&rOff<45)driftOn=false;             // fly back into the course's reach and it simply has you again
  driftK+=((driftOn?1:0)-driftK)*Math.min(1,dt*0.45);
  hudEl.style.opacity=String(1-driftK*0.92);
  hudPos.style.opacity=String(1-driftK*0.95);
  if(driftGain)driftGain.gain.value=driftK*0.017;
  setEngine((p.speed/330,0,1),playerBoosting,clamp(p.speed/330,0,1)*(1-driftK*0.97),playerBoosting,sec.name==='THE SHADOW');
  // the race can end without you. that is allowed to be a fact, not a failure.
  if(driftOn&&!raceWentOn&&racers.every(function(r){return r===player||r.finished;})){
    raceWentOn=true;
    annEl.textContent='the race has ended without you';
    annEl.classList.add('show');annT=-4;
  }
  // section announce + quiet hud
  // sector timing: close the book on each section as the line leaves it
  const si=SECTIONS.indexOf(sec);
  if(si!==splitIdx){
    if(splitIdx>=0)splits[SECTIONS[splitIdx].name]=raceT-splitMark;
    splitIdx=si;splitMark=raceT;
  }
  if(openShown){if(rOff<20)openShown=false;}else{if(rOff>30)openShown=true;}
  const dispName=(driftOn?'THE DRIFT':(openShown?'THE OPEN':sec.name));
  if(dispName!==curSecName){curSecName=dispName;annEl.textContent=dispName;annEl.classList.add('show');annT=0;}
  annT+=dt;
  if(annT>2.6)annEl.classList.remove('show');
  hudEl.classList.toggle('quiet',sec.name==='THE SHADOW');
  // hud
  let rank=1;
  for(let i=0;i<racers.length;i++){
    const o=racers[i];if(o===p)continue;
    if(o.finished||o.s>p.s)rank++;
  }
  hudPos.textContent=['1ST','2ND','3RD','4TH'][rank-1];
  const km=Math.max(0,(FINISH-p.s)/FINISH*73000);
  hudDist.textContent='CLOUDS '+Math.round(km).toLocaleString('en-GB')+' KM';
  hudSpd.textContent=(p.speed*0.105).toFixed(1)+' KM/S';
  boostFill.style.width=boostMeter+'%';
  // record, for the re-living
  recBuf.push(racers.reduce(function(acc,r){acc.push(r.s,r.x,r.y);return acc;},[raceT]));
  // finish
  if(p.s>=FINISH){
    p.finished=true;p.fTime=raceT;finishOrder.push(p);
    finishTone();phase='done';doneT=0;resShown=false;
    flashEl.style.opacity=0;
  }
}

function updateDone(dt){
  raceT+=dt;doneT+=dt;
  const p=player;
  p.speed=lerp(p.speed,55,Math.min(1,dt*0.8));
  p.s+=p.speed*dt;
  p.mesh.rotation.z*=0.95;p.mesh.rotation.x*=0.95;
  for(let i=0;i<racers.length;i++)if(racers[i]!==p)updateRival(racers[i],dt);
  updateHazards(dt,p.s);
  placeWorld(p.s);placeRacers(p.s,dt);
  camera.position.set(p.x*0.4,4.6+p.y*0.4,16);
  const lookY=lerp(1,-36,Math.min(1,doneT*0.25));
  camera.lookAt(p.x*0.4,lookY,-400);
  camera.fov=lerp(camera.fov,60,dt*1.5);camera.updateProjectionMatrix();
  setEngine(0.15,false,true);
  lightLevel+=(1.05-lightLevel)*Math.min(1,dt);
  ambientL.intensity=0.95*lightLevel;sun.intensity=1.15*lightLevel;
  veilEl.style.opacity=0;
  hudEl.classList.remove('quiet');
  // arrival: the engine winds down, you coast, received — then the card
  if(actx){engGain.gain.value*=(1-Math.min(1,dt*1.4));windGain.gain.value*=(1-Math.min(1,dt*1.4));
    if(driftGain)driftGain.gain.value*=(1-Math.min(1,dt*1.2));}
  hudEl.style.opacity=String(Math.max(0,1-doneT*0.8));
  if(!resShown&&doneT>3.0){
    resShown=true;
    const place=finishOrder.indexOf(p)+1;
    resTitle.textContent=['FIRST','SECOND','THIRD','FOURTH'][place-1];
    resSub.textContent=fmtTime(p.fTime)+' — '+(place===1?'The rings release you.':'The rings release you anyway.');
    if(splitIdx>=0)splits[SECTIONS[splitIdx].name]=p.fTime-splitMark;
    (function(){const prev=loadSplits();let sT='';
      for(let i=0;i<SECTIONS.length;i++){
        const nm=SECTIONS[i].name,v=splits[nm];
        if(v===undefined)continue;
        let d='';
        if(prev&&prev[nm]!==undefined){const g=v-prev[nm];
          d=' <span style="opacity:.6">'+(g>=0?'+':'\u2212')+Math.abs(g).toFixed(1)+'</span>';}
        sT+='<div style="display:flex;justify-content:space-between;max-width:280px;margin:0 auto">'+
          '<span style="opacity:.6">'+nm.toLowerCase()+'</span><span>'+fmtTime(v)+d+'</span></div>';
      }
      resSub.innerHTML+='<div style="margin-top:14px;font-size:11px;letter-spacing:.1em;line-height:1.9">'+sT+'</div>';
    })();

    (function(){const m=p.fTime;const sl=loadLine();
      if(sl===null||m<sl){saveLine(m);saveSplits(splits);resSub.textContent+=' · a new standing line';}
      else{resSub.textContent+=' · standing line '+fmtTime(sl);}
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({moonline:'crossed',track:TRACK_KEY},'*');}catch(e){}
    })();
    results.style.display='flex';
    boostBtn.style.display='none';
  }
  if(resShown)renderResultsList();
}


// ------------------------------------------------------------ relive
// The race, re-lived from outside. Time dilates depending on where you are.
let recBuf=[],inpBuf=[],relT=0,relIdx=0,relPBase=1;
let relShot=0,relShotI=-1,relShotT=0,relSide=1,relRock=null;
function startRelive(){
  if(recBuf.length<10||!player)return;
  results.style.display='none';
  relT=recBuf[0][0];relIdx=0;relShotI=-1;relShotT=0;relRock=null;
  relPBase=1+racers.indexOf(player)*3;
  curSecName='';
  relLbl.style.display='block';
  phase='relive';
  blip(520,0.15,0.12);
}
function updateRelive(dt){
  // rivals still out there keep racing their own race while you watch yours
  for(let i=0;i<racers.length;i++){const r=racers[i];if(r!==player&&!r.finished)updateRival(r,dt);}
  while(relIdx<recBuf.length-2&&recBuf[relIdx+1][0]<=relT)relIdx++;
  const f=recBuf[relIdx],nxt=recBuf[Math.min(relIdx+1,recBuf.length-1)];
  const span=Math.max(0.0001,nxt[0]-f[0]);
  const k=clamp((relT-f[0])/span,0,1);
  const s=lerp(f[relPBase],nxt[relPBase],k);
  const px=lerp(f[relPBase+1],nxt[relPBase+1],k);
  const py=lerp(f[relPBase+2],nxt[relPBase+2],k);
  const pspd=(nxt[relPBase]-f[relPBase])/span;
  const sec=sectionAt(s);
  const dil=sec.dil||1;
  relT+=dt*dil;
  // racers from the record
  for(let i=0;i<racers.length;i++){
    const b=1+i*3;
    const rs=lerp(f[b],nxt[b],k);
    racers[i].mesh.position.set(lerp(f[b+1],nxt[b+1],k),lerp(f[b+2],nxt[b+2],k),-(rs-s));
    const spd=(nxt[b]-f[b])/span;
    if(racers[i].mesh.userData.anim)racers[i].mesh.userData.anim(dt*dil,{n:clamp(spd/racers[i].def.top,0,1),speed:spd,boost:false,den:(sectionAt(rs).den!==undefined?sectionAt(rs).den:0.5)});
    racers[i].mesh.visible=true;
  }
  // weather, not threat: hazards keep coming, nothing can touch a finished racer
  const secAhead2=sectionAt(s+420);
  astAcc+=secAhead2.ast*dt*dil;
  while(astAcc>=1){astAcc-=1;spawnAst(s,py,secAhead2);}
  spkAcc+=(secAhead2.spk||0)*dt*dil;
  while(spkAcc>=1){spkAcc-=1;spawnSpoke(s);}
  updateHazards(dt*dil,s);
  lightLevel+=(sec.light-lightLevel)*Math.min(1,dt*1.5);
  ambientL.intensity=0.95*Math.max(0.05,lightLevel);
  sun.intensity=1.15*Math.max(0.04,lightLevel);
  fogPulse=Math.max(0,fogPulse*(1-dt*1.05));
  scene.fog.density=0.0018+fogPulse*0.03;
  const fallK=clamp((s-23200)/(FINISH-23200),0,1);
  const sheetFade=1-fallK*0.94;
  sheetMat.opacity=0.055*Math.max(0.25,lightLevel)*sheetFade;
  sheetBotMat.opacity=0.05*Math.max(0.25,lightLevel)*sheetFade;
  iceMat.opacity=0.5*Math.max(0.2,lightLevel)*sheetFade;
  clouds.position.y=lerp(-520,-34,fallK);
  const ia2=iceAttr.array;
  for(let i=0;i<ICE_N;i++){ia2[i*3+2]+=pspd*dt*0.96+SHEAR_K*ia2[i*3]*dt*0.08;if(ia2[i*3+2]>20){ia2[i*3]=vrand(-240,240);ia2[i*3+1]=PLANE_Y+vrand(-2.8,2.8);ia2[i*3+2]=-1500;}}
  iceAttr.needsUpdate=true;
  const da=dustAttr.array;
  for(let i=0;i<DUST_N;i++){da[i*3+2]+=pspd*dil*dt*0.92;if(da[i*3+2]>14){da[i*3]=vrand(-90,90);da[i*3+1]=vrand(-30,50);da[i*3+2]=-620;}}
  dustAttr.needsUpdate=true;
  placeWorld(s);
  // spectate: cut between the machine, the rocks, and the way-out wide
  relShotT-=dt;
  if(relShot===5&&relRock&&relRock.s<s-30)relShotT=0;   // the rock has been passed
  if(relShotT<=0){
    relShotI++;
    relShot=(relShotI%3===2)?((relShotI%2===0)?4:5):relShotI%4;   // every third shot: wide, or from the rocks
    relShotT=rand(5,8);
    relSide=Math.random()<0.5?-1:1;
    relRock=null;
    if(relShot===5){
      for(let i=0;i<asteroids.length;i++){const a=asteroids[i];if(a.s>s+160&&a.s<s+420){relRock=a;break;}}
      if(!relRock)relShot=4;   // no rock ahead: go wide instead
    }
  }
  if(relShot===0)camera.position.set(px+16+Math.sin(t*0.2)*2.5,py+5,3);
  else if(relShot===1)camera.position.set(px-16-Math.sin(t*0.17)*2.5,py+6,5);
  else if(relShot===2)camera.position.set(px+Math.sin(t*0.15)*6,py+22,9);
  else if(relShot===3)camera.position.set(px*0.5,py+2.6,-26+Math.sin(t*0.13)*3);
  else if(relShot===4)camera.position.set(px+relSide*(84+Math.sin(t*0.11)*10),py+34,-52);   // way out: the field as lights
  else if(relRock)camera.position.set(relRock.x+2.6,relRock.y+2.2,-(relRock.s-s));          // from the rocks
  camera.lookAt(px,py,0);
  camera.fov=(relShot===4?50:58);camera.updateProjectionMatrix();
  // section announce, as it was — and the open, if the line went there
  const rOffR=Math.sqrt(px*px+(py-1.5)*(py-1.5));
  const dispNameR=(rOffR>26?'THE OPEN':sec.name);
  if(dispNameR!==curSecName){curSecName=dispNameR;annEl.textContent=dispNameR;annEl.classList.add('show');annT=0;}
  annT+=dt;
  if(annT>2.6)annEl.classList.remove('show');
  relLbl.textContent='reliving — '+sec.name.toLowerCase()+' · time ×'+dil.toFixed(2);
  setEngine(0.06,false,true);   // outside the machine, space is nearly silent
  if(relT>=recBuf[recBuf.length-1][0]){
    phase='done';relLbl.style.display='none';
    results.style.display='flex';renderResultsList();
  }
}

// ------------------------------------------------------------ loop
let simAcc=0;
function tick(){
  window.requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.1);
  if(phase==='race'){
    // fixed-step: identical ticks, identical race, on any machine
    simAcc=Math.min(simAcc+dt,0.1);
    while(simAcc>=SIM_DT&&phase==='race'){t+=SIM_DT;updateRace(SIM_DT);simAcc-=SIM_DT;}
  }else{
    t+=dt;
    if(phase==='grid')updateGrid(dt);
    else if(phase==='count')updateCount(dt);
    else if(phase==='done')updateDone(dt);
    else if(phase==='relive')updateRelive(dt);
  }
  renderer.render(scene,camera);
}
tick();

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// debug hooks (harmless in production)
window.__ML={
  get phase(){return phase;},
  racers:racers,
  get seed(){return SEED_HEX;},
  camera:camera,
  heading:function(){return hYaw;},
  get drifting(){return driftOn;},
  get line(){return {v:1,track:TRACK_KEY,seed:SEED_HEX,simdt:SIM_DT,
    time:(player&&player.fTime)||0,ticks:(inpBuf.length/3)|0,inputs:inpBuf};},
  relive:function(){startRelive();},
  setPlayerSpeed:function(v){if(player)player.speed=v;},
  choose:function(i){sel=i;showVehicle();},
  confirm:confirmPick,
  setPlayerS:function(v){if(player)player.s=v;},
  setPlayerY:function(v){if(player)player.y=v;},
  asteroids:asteroids,
  get light(){return lightLevel;},
  get fogPulse(){return fogPulse;},
  spawnAstAt:function(){if(player){spawnAst(player.s-500,player.y,{wave:0});const a=asteroids[asteroids.length-1];a.s=player.s+8;a.x=player.x;a.y=player.y;a.vx=0;}},
  spawnSpokeAt:function(){if(player){spawnSpoke(player.s);const sp=spokes[spokes.length-1];sp.s=player.s+8;sp.x=player.x;sp.y=player.y;sp.life=1.7;}}
};
})();
</script>
